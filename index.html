<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hanja-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="어흥!한자 — 한국어문회 한자능력검정시험 급수를 준비하는 학습 앱. 간격 반복(FSRS)·획순 따라쓰기·모의시험. 광고 없음, 개인정보 수집 없음.">

  <!--
    링크 미리보기·검색 노출용 메타. 주소는 lib/app_links.dart의 kAppSiteUrl과
    같은 값이어야 하고(어긋나면 test/app_links_test.dart 실패), 정식 도메인으로
    옮길 때 이 파일·sitemap.xml·robots.txt·kAppSiteUrl 넷을 함께 고친다.
    og:image는 새로 만들지 않고 이미 있는 앱 아이콘을 쓴다.
  -->
  <link rel="canonical" href="https://bryannamd.github.io/hanja-web/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="어흥!한자">
  <meta property="og:title" content="어흥!한자 — 한자 급수 학습">
  <meta property="og:description" content="한국어문회 한자능력검정시험 급수를 준비합니다. 간격 반복·획순 따라쓰기·모의시험. 광고 없음, 개인정보 수집 없음.">
  <meta property="og:url" content="https://bryannamd.github.io/hanja-web/">
  <meta property="og:image" content="https://bryannamd.github.io/hanja-web/icons/Icon-512.png">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="어흥!한자 — 한자 급수 학습">
  <meta name="twitter:description" content="한국어문회 한자능력검정시험 급수를 준비합니다. 간격 반복·획순 따라쓰기·모의시험. 광고 없음, 개인정보 수집 없음.">
  <meta name="twitter:image" content="https://bryannamd.github.io/hanja-web/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="어흥!한자">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>어흥!한자</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    첫 화면 전 안내 + 실패 복구. Flutter가 첫 프레임을 그리면 `flutter-first-frame`
    이벤트로 이 블록을 지운다. 스크립트·CanvasKit·자산이 안 받아져 앱이 아예 못
    뜨면(이때는 Dart 오류 화면도 없다) 한국어 설명과 '다시 시도' 버튼을 보인다.
    이 문구는 '로딩 화면이 떴다'는 뜻일 뿐 학습 준비가 끝났다는 뜻이 아니다 —
    학습 가능 시점은 tool/web_perf_measure.md 절차로 따로 잰다.
  -->
  <div id="boot" role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#3b3b3b;background:#fffaf0">
    <div id="boot-msg" style="font-size:17px;line-height:1.5">어흥!한자를 불러오고 있어요</div>
    <button id="boot-retry" type="button" hidden style="min-width:120px;min-height:48px;padding:0 24px;border:0;border-radius:24px;background:#c2410c;color:#fff;font-size:16px;font-weight:600">다시 시도</button>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var msg = document.getElementById('boot-msg');
      var retry = document.getElementById('boot-retry');
      var done = false;
      function fail(text) {
        if (done) return;
        msg.textContent = text;
        retry.hidden = false;
      }
      retry.addEventListener('click', function () { location.reload(); });
      window.addEventListener('flutter-first-frame', function () {
        done = true;
        boot.remove();
      });
      // 스크립트 파일 자체를 못 받은 경우(오프라인·서버 오류). 리소스 오류는 버블링하지
      // 않아 capture 단계에서 잡는다.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') {
          fail('앱 파일을 받지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
        }
      }, true);
      // 연결이 느릴 뿐일 수 있어 기다리던 안내는 지우지 않고 버튼만 연다.
      setTimeout(function () {
        if (!done) {
          msg.textContent = '시간이 오래 걸리고 있어요. 계속 기다리거나 다시 시도할 수 있어요.';
          retry.hidden = false;
        }
      }, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
